version: 2

updates:
  # ---------------------------------------------------- GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
        patterns: ['*']

  # ---------------------------------------------------- engine bot (bot-js)
  - package-ecosystem: npm
    directory: /bot-js
    schedule:
      interval: weekly
      day: monday
      time: '03:10'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(bot-js)'
      include: scope
    versioning-strategy: increase
    ignore:
      # Engine ini HARUS tetap Node 18-compatible karena nodejs-mobile mentok
      # di Node 18.20.4. Naikkan versi Baileys secara manual + jalankan
      # `npm run build && node dist/bundle.cjs --selftest` di Node 18 dulu.
      - dependency-name: '@whiskeysockets/baileys'
        update-types: ['version-update:semver-major']
      # pino 10 menarik thread-stream 4 yang butuh Node >= 20. Engine ini
      # dibundle untuk Node 18.20.4 (plafon nodejs-mobile), jadi pino major
      # cuma boleh naik BARENGAN upgrade nodejs-mobile — bukan lewat PR.
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']
    groups:
      bot-js:
        patterns: ['*']
        exclude-patterns: ['@whiskeysockets/baileys']

  # ---------------------------------------------------- CLI (Termux)
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
      day: monday
      time: '03:20'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(cli)'
      include: scope
    ignore:
      # Sama seperti bot-js: pino 10 butuh Node >= 20 sedangkan CLI ini
      # dinyatakan jalan di Node >= 18 (Termux).
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']
    groups:
      cli:
        patterns: ['*']

  # ---------------------------------------------------- Gradle / Android
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(android)'
      include: scope
    ignore:
      # SEMUA major di ekosistem gradle di-ignore, bukan cuma AGP.
      # Alasannya: AGP, versi Gradle di wrapper, Kotlin, dan okhttp saling
      # terikat. Dependabot pernah ngajuin PR yang naikin AGP 8.5.2 -> 9.4.1
      # SEKALIGUS wrapper Gradle 8.9 -> 9.7.1 dan okhttp 4 -> 5 dalam satu PR;
      # itu migrasi besar, bukan update rutin, dan kalau dilolosin build yang
      # sudah hijau langsung rusak.
      # Minor & patch tetap lewat otomatis. Major dinaikkan manual:
      # edit build.gradle + gradle-wrapper.properties, lalu jalankan
      # ./gradlew assembleRelease buat memastikan masih jalan.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      android:
        patterns: ['*']
