version: 2

updates:
  # ---------------------------------------------------- GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
        patterns: ['*']

  # ---------------------------------------------------- npm workspaces (root)
  # Satu lockfile di root untuk bot-js + cli.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:10'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(js)'
      include: scope
    versioning-strategy: increase
    ignore:
      # Engine HARUS tetap Node 18-compatible: nodejs-mobile mentok di 18.20.4.
      # Baileys major dinaikkan manual + selftest di Node 18 dulu.
      - dependency-name: '@whiskeysockets/baileys'
        update-types: ['version-update:semver-major']
      # pino 10 menarik thread-stream 4 (Node >= 20); cuma boleh naik barengan
      # upgrade nodejs-mobile, bukan lewat PR.
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']
    groups:
      js:
        patterns: ['*']
        exclude-patterns: ['@whiskeysockets/baileys']

  # ---------------------------------------------------- Gradle / Android
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(android)'
      include: scope
    ignore:
      # SEMUA major di ekosistem gradle di-ignore, bukan cuma AGP.
      # Alasannya: AGP, versi Gradle di wrapper, Kotlin, dan okhttp saling
      # terikat. Dependabot pernah ngajuin PR yang naikin AGP 8.5.2 -> 9.4.1
      # SEKALIGUS wrapper Gradle 8.9 -> 9.7.1 dan okhttp 4 -> 5 dalam satu PR;
      # itu migrasi besar, bukan update rutin, dan kalau dilolosin build yang
      # sudah hijau langsung rusak.
      # Minor & patch tetap lewat otomatis. Major dinaikkan manual:
      # edit build.gradle + gradle-wrapper.properties, lalu jalankan
      # ./gradlew assembleRelease buat memastikan masih jalan.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      android:
        patterns: ['*']
