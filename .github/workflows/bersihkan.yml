name: Bersihkan jejak Actions

# Tiap push bikin 5 workflow jalan; log, artifact, dan cache-nya numpuk terus.
# Workflow ini yang nyapu: riwayat run lama, artifact kedaluwarsa, dan cache
# yang sudah lama tidak dipakai. APK hasil build `main` TIDAK ikut hilang karena
# dia bukan artifact — dia ada di draft release (job `release-internal` di
# build-apk.yml).
#
# Dua profil (permintaan kall 2026-10-04: "setelah build release draft, hapus
# jejak actions, artifacts, cache"):
#   - workflow_run (tiap kali "Build APK" di main selesai) → FULL WIPE: semua
#     run selesai (beserta log + artifact-nya) dihapus; yang tersisa cuma run
#     sapuan ini sendiri. Cache dibuang dari yang lebih tua dari ±1 jam (yang
#     lebih muda dari itu mungkin masih dipakai workflow lain yang belum
#     selesai — dibuang besoknya lewat sapuan harian).
#   - schedule harian 20.00 UTC (03.00 WIB) → run & artifact > 12 jam dibuang
#     (termasuk run sapuan kemarin — jejak nggak pernah lebih tua dari sehari),
#     cache > 24 jam tidak dipakai.
# Bisa juga dipanggil manual dengan umur yang lebih pendek kalau mau lebih agresif.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      hari-run:
        description: 'Hapus riwayat run yang lebih tua dari (hari)'
        default: '2'
      hari-artifact:
        description: 'Hapus artifact yang lebih tua dari (hari)'
        default: '1'
      hari-cache:
        description: 'Hapus cache yang tidak dipakai lebih dari (hari)'
        default: '2'
      batas-cache-mb:
        description: 'Batas total cache (MB); kelebihannya dibuang dari yang paling lama'
        default: '1500'

permissions:
  contents: read
  actions: write        # buat hapus run / artifact / cache

concurrency:
  group: bersihkan-actions
  cancel-in-progress: false

jobs:
  bersihkan:
    name: Sapu run, artifact, cache
    # workflow_run jalan dengan secret repo, jadi harus dipastiin yang micu
    # adalah run dari repo INI -- bukan PR dari fork yang cabangnya kebetulan
    # diberi nama "main". Tanpa penjaga ini, alur `workflow_run` jadi celah
    # klasik buat nyolong token dari fork.
    if: github.event_name != 'workflow_run' ||
        github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bersihkan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Profil: manual pakai inputnya; workflow_run (seusai Build APK main)
          # FULL WIPE; sapuan harian: run/artifact > 12 jam, cache > 24 jam.
          HARI_RUN: ${{ inputs.hari-run || (github.event_name == 'workflow_run' && '0' || '0.5') }}
          HARI_ARTIFACT: ${{ inputs.hari-artifact || (github.event_name == 'workflow_run' && '0' || '0.5') }}
          # Cache: 0,05 hari (±1 jam) — jangan sentuh cache yang mungkin masih
          # dipakai workflow lain yang belum selesai (security/code-quality).
          HARI_CACHE: ${{ inputs.hari-cache || (github.event_name == 'workflow_run' && '0.05' || '1') }}
          BATAS_CACHE_MB: ${{ inputs.batas-cache-mb || (github.event_name == 'workflow_run' && '400' || '1500') }}
          # Full wipe = sisakan cuma 1 (run sapuan ini sendiri; run build yang
          # memicu ikut dihapus — logistiknya sudah pindah ke draft release).
          # Sapuan harian = 5 (konteks sehari). Run yang LAGI jalan memang
          # nggak bisa dihapus API.
          SIMPAN_RUN: ${{ github.event_name == 'workflow_run' && '1' || '5' }}
        run: python3 scripts-dev/bersihkan_actions.py

      - name: Sisa pakai
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/cache/usage" |
            python3 -c "import json,sys; d=json.load(sys.stdin); print('cache:', round(d.get('active_caches_size_in_bytes',0)/1048576,1), 'MB /', d.get('active_caches_count'), 'entri')"
