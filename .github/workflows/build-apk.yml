name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle engine bot (esbuild → bundle.cjs)
        run: |
          cd bot-js
          npm ci --no-audit --no-fund
          npm run build
          npm run selftest
          mkdir -p ../app/src/main/assets/node
          cp dist/bundle.cjs ../app/src/main/assets/node/bundle.cjs
          du -h ../app/src/main/assets/node/bundle.cjs

      - name: Download nodejs-mobile (libnode.so + header)
        run: |
          VER=v18.20.4
          curl -fsSL -o /tmp/njsm.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${VER}/nodejs-mobile-v18.20.4-android.zip"
          unzip -q /tmp/njsm.zip -d /tmp/njsm
          mkdir -p app/src/main/jniLibs/arm64-v8a app/libnode
          cp /tmp/njsm/bin/arm64-v8a/libnode.so app/src/main/jniLibs/arm64-v8a/libnode.so
          cp -r /tmp/njsm/include app/libnode/include
          du -h app/src/main/jniLibs/arm64-v8a/libnode.so

      - name: Siapkan keystore release (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "RELEASE_KEYSTORE_FILE=$PWD/release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=***"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=***"
            } >> "$GITHUB_ENV"
            echo "✅ Keystore release siap — APK akan di-sign resmi"
          else
            echo "ℹ️ Secrets keystore belum diset — APK di-sign dengan debug key (tetap bisa di-install)"
          fi

      - name: Build APK (assembleRelease)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleRelease
          ndk: '26.1.10909125'
          cmake: '3.22.1'

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk wa-release-bot-arm64-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-release-bot-arm64
          path: wa-release-bot-arm64-release.apk
