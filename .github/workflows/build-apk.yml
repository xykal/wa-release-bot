name: Build APK

# Alur:
#   push ke main / PR  → build APK arm64-v8a, upload sebagai artifact
#   push tag v*        → build TIGA APK (arm64-v8a, armeabi-v7a, universal)
#                        + bikin GitHub Release berisi ketiganya
#   workflow_dispatch  → build manual, bisa pilih varian dan ABI-nya
#
# Kenapa tiga APK di Release, bukan cuma universal:
#   file libnode.so itu gemuk (±49 MB mentah, ±19 MB setelah dikompresi APK).
#   Kalau digabung jadi satu APK universal, ukurannya ±37 MB — padahal satu HP
#   cuma butuh SATU arsitektur. Dengan APK terpisah, yang 64-bit dapat ±21 MB
#   dan yang 32-bit dapat ±20 MB. Yang universal tetap disediakan buat yang
#   nggak mau mikir HP-nya 32 atau 64 bit.
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build-variant:
        description: 'Varian yang dibuild'
        type: choice
        default: release
        options: [release, debug]
      abis:
        description: 'ABI yang dipackage (HP 32-bit butuh armeabi-v7a)'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - arm64-v8a,armeabi-v7a

# Concurrency-nya per-job, bukan di level workflow.
# Alasannya: build dari tag sekarang memakai MATRIX (3 APK sekaligus). Kalau
# concurrency-nya di level workflow, ketiga sel matrix itu masuk grup yang sama
# dan saling membatalkan — cuma satu yang selesai.
#   - job `apk`  : grupnya memuat ABI-nya, jadi ketiga sel jalan berdampingan,
#                  tapi push berturut-turut dengan ABI sama tetap saling batalkan.
#   - job `engine`: sekali jalan saja, batalkan kalau ada push baru.
#   - job `release`: SENGAJA tanpa concurrency — release nggak boleh dibatalkan.

permissions:
  contents: read

env:
  NODE_VERSION: '18.20.4'          # PERSIS sama dengan Node di dalam nodejs-mobile
  NODE_BUILD_VERSION: '20'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  NODEJS_MOBILE_VERSION: 'v18.20.4'
  # Catatan: ABIS TIDAK di sini, tapi di job `apk` sebagai env job
  # (ABIS: ${{ matrix.abis }}). Daftar ABI-nya sendiri dihitung di job `setup`.

jobs:
  # ==========================================================================
  #  0) Tentukan daftar ABI yang mau dibuild
  # ==========================================================================
  setup:
    name: Tentukan ABI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      abi-matrix: ${{ steps.pick.outputs.matrix }}
      jumlah: ${{ steps.pick.outputs.jumlah }}
    steps:
      - name: Pilih set ABI
        id: pick
        # Ekspresi GitHub-nya ditaruh di env dulu, bukan ditempel langsung ke
        # dalam skrip. Dua alasan:
        #   1. actionlint menjalankan shellcheck atas skrip ini, dan ekspresi
        #      yang ditempel jadi literal bikin perbandingannya "literal vs
        #      literal" → kena SC2193 (pernah bikin Code quality merah).
        #   2. lebih aman: nilai ekspresi diperlakukan sebagai data, bukan
        #      sebagai potongan skrip.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ABIS: ${{ inputs.abis }}
        run: |
          # 1. build manual → hormati pilihan input 'abis'
          # 2. build dari TAG v* → tiga-tiganya (arm64, v7a, universal)
          # 3. selain itu (push/PR) → arm64-v8a saja, biar CI-nya cepat.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SET="[\"$INPUT_ABIS\"]"
          elif [[ "$REF" == refs/tags/v* ]]; then
            SET='["arm64-v8a","armeabi-v7a","arm64-v8a,armeabi-v7a"]'
          else
            SET='["arm64-v8a"]'
          fi

          echo "matrix=$SET" >> "$GITHUB_OUTPUT"
          echo "jumlah=$(echo "$SET" | tr ',' '\n' | grep -c '"')" >> "$GITHUB_OUTPUT"
          echo "Daftar ABI yang dibuild: $SET"

  # ==========================================================================
  #  1) Engine Node.js — lint, unit test, bundle, smoke test di Node 18
  # ==========================================================================
  engine:
    name: Engine (bot-js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-apk-engine-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ env.NODE_VERSION }} (sama dengan nodejs-mobile)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (npm workspaces, root)
        # --ignore-scripts: preinstall Baileys 6.7.24 hard-fail kalau Node < 20,
        # padahal runtime APK adalah Node 18.20.4 (nodejs-mobile) dan bundle-nya
        # dibuktikan jalan di "Smoke test" di bawah. esbuild ambil binary lewat
        # optionalDependencies, bukan postinstall, jadi aman.
        # Lockfile root dibuat oleh job "Lockfile root" di Code quality; kalau
        # commit ini belum punya, pakai npm install supaya build tidak berhenti.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npx esbuild --version

      # Lint tidak di sini: eslint baru butuh Node >= 20, job ini dipaku 18.20.4.
      # Lint ada di workflow Code quality (Node 22).

      - name: Unit test
        run: npm test -w bot-js

      - name: Bundle engine (esbuild -> dist/bundle.cjs)
        run: npm run build -w bot-js

      - name: Smoke test bundle di Node ${{ env.NODE_VERSION }}
        working-directory: bot-js
        run: |
          node dist/bundle.cjs --selftest
          node -e "
            const s = require('fs').statSync('dist/bundle.cjs').size;
            console.log('bundle.cjs =', (s/1048576).toFixed(1), 'MB');
            if (s < 100000) { throw new Error('bundle mencurigakan kecil'); }
          "

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-bundle
          path: bot-js/dist/bundle.cjs
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  #  2) APK Android — satu job per set ABI (matrix)
  # ==========================================================================
  apk:
    name: APK (${{ matrix.abis }})
    needs: [engine, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # env job: semua step di bawah tetap bisa pakai $ABIS seperti biasa.
    env:
      ABIS: ${{ matrix.abis }}

    # Grupnya memuat ABI, jadi ketiga sel matrix nggak saling membatalkan —
    # tapi push berturut-turut dengan ABI sama tetap saling batalkan.
    concurrency:
      group: build-apk-apk-${{ github.ref }}-${{ matrix.abis }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    strategy:
      fail-fast: false
      matrix:
        abis: ${{ fromJSON(needs.setup.outputs.abi-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tentukan varian & nama APK
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VARIANT: ${{ inputs.build-variant }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            VARIANT="debug"
          else
            VARIANT="${INPUT_VARIANT:-release}"
          fi
          if [ "$VARIANT" = "debug" ]; then
            TASK="assembleDebug"
            APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            TASK="assembleRelease"
            APK="app/build/outputs/apk/release/app-release.apk"
          fi

          # Nama file dibuat dari daftar ABI-nya: 'arm64' kalau cuma arm64-v8a,
          # 'universal' kalau lebih dari satu.
          case "$ABIS" in
            *","*) ABI_TAG="universal" ;;
            armeabi-v7a) ABI_TAG="armeabi-v7a" ;;
            *) ABI_TAG="arm64" ;;
          esac

          # Cache key GitHub nggak boleh mengandung koma, jadi daftar ABI-nya
          # diubah jadi slug: 'arm64-v8a,armeabi-v7a' → 'arm64-v8a-armeabi-v7a'.
          ABI_SLUG="$(echo "$ABIS" | tr ',' '-')"

          {
            echo "variant=$VARIANT"
            echo "task=$TASK"
            echo "apk-path=$APK"
            echo "apk-name=wa-release-bot-$ABI_TAG-$VARIANT.apk"
            echo "abi-slug=$ABI_SLUG"
          } >> "$GITHUB_OUTPUT"
          echo "Varian: $VARIANT ($TASK)"
          echo "ABI   : $ABIS → $ABI_TAG"

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK + CMake
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: Ambil bundle engine dari artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-bundle
          path: app/src/main/assets/node

      - name: Verifikasi bundle ada
        run: ls -la app/src/main/assets/node/bundle.cjs

      - name: Cache nodejs-mobile (libnode.so + header, ±57MB)
        id: njsm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/src/main/jniLibs
            app/libnode
          # Cache key HARUS memuat daftar ABI-nya. Kalau nggak, build v7a bakal
          # kena cache arm64 dan libnode.so v7a-nya nggak pernah keunduh —
          # build-nya gagal di CMake dengan 'libnode.so tidak ditemukan'.
          # Dipakai slug (bukan env.ABIS langsung) karena cache key GitHub
          # MENOLAK koma: 'Key Validation Error: ... cannot contain commas'.
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}-${{ steps.vars.outputs.abi-slug }}

      - name: Download nodejs-mobile
        if: steps.njsm-cache.outputs.cache-hit != 'true'
        env:
          NODEJS_MOBILE_VERSION: ${{ env.NODEJS_MOBILE_VERSION }}
          ABIS: ${{ env.ABIS }}
        run: bash scripts/fetch-nodejs-mobile.sh

      - name: Siapkan keystore release (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "✅ Keystore release siap — APK akan di-sign resmi"
          else
            echo "ℹ️ Secrets keystore belum diset — APK di-sign dengan debug key (tetap bisa di-install)"
          fi

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit test Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint Android (SARIF untuk Code Scanning)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload hasil lint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-results
          path: app/build/reports/lint-results-*.{html,xml,sarif}
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK (${{ steps.vars.outputs.task }})
        run: |
          ./gradlew --no-daemon ${{ steps.vars.outputs.task }} \
            -Pabis="${{ env.ABIS }}" \
            -PversionName="${GITHUB_REF_NAME#v}" \
            --stacktrace

      - name: Rename + checksum
        id: package
        run: |
          mkdir -p dist
          cp "${{ steps.vars.outputs.apk-path }}" "dist/${{ steps.vars.outputs.apk-name }}"
          cd dist || exit 1
          sha256sum "${{ steps.vars.outputs.apk-name }}" > "${{ steps.vars.outputs.apk-name }}.sha256"
          ls -la
          cat "${{ steps.vars.outputs.apk-name }}.sha256"

      - name: Cek isi APK (bundle + libnode ikut ter-package)
        run: |
          APK="dist/${{ steps.vars.outputs.apk-name }}"
          unzip -l "$APK" | grep -E 'libnode\.so|bundle\.cjs|libnodebridge\.so' || {
            echo "❌ bundle.cjs atau libnode.so tidak ada di dalam APK"; exit 1; }

          # Pastikan SETIAP ABI yang diminta benar-benar ikut, bukan cuma salah satu.
          FAIL=0
          for ABI in $(echo "$ABIS" | tr ',' ' '); do
            if unzip -l "$APK" | grep -q "lib/${ABI}/libnode.so"; then
              echo "✅ lib/${ABI}/libnode.so ada"
            else
              echo "❌ lib/${ABI}/libnode.so TIDAK ada di dalam APK"; FAIL=1
            fi
          done
          exit $FAIL

      # R8 me-rename class & method. Kalau ada yang dipanggil lewat nama
      # (JNI, WorkManager, sistem Android) dan ikut ke-rename, aplikasinya
      # crash DI HP — bukan di CI. Jadi nama-nama penting itu diperiksa
      # langsung di dalam classes.dex hasil build.
      # ----------------------------------------------------------------------
      # Jembatan JNI: ada di dalam APK belum cukup, Android baru menautkan
      # sebuah .so kalau ada yang memintanya lewat System.loadLibrary().
      #
      # Dulu langkah ini nggak ada, dan yang kejadian: .so-nya ada di APK,
      # simbolnya juga ada, tapi NodeBridge nggak pernah manggil loadLibrary →
      # tiap panggilan native melempar UnsatisfiedLinkError → mesin Node nggak
      # pernah nyala → QR nggak muncul, setup nggak jalan. Build-nya hijau,
      # APK-nya "benar", tapi fiturnya mati semua.
      #
      # Jadi dua-duanya diperiksa: file-nya ada, DAN simbol JNI-nya benar.
      # ----------------------------------------------------------------------
      - name: Cek jembatan JNI (libnodebridge.so + simbol startNode)
        run: |
          APK="dist/${{ steps.vars.outputs.apk-name }}"
          SIMBOL="Java_com_xykals_warelease_NodeBridge_startNode"
          FAIL=0

          # readelf bagian dari binutils, udah ada di runner ubuntu. Dicek
          # eksplisit biar kalau suatu saat hilang, pesannya jelas — bukan
          # "command not found" yang bikin bingung.
          if ! command -v readelf >/dev/null 2>&1; then
            echo "❌ readelf nggak ada di runner — nggak bisa verifikasi simbol JNI"
            exit 1
          fi

          for ABI in $(echo "$ABIS" | tr ',' ' '); do
            TMP="$(mktemp -d)"
            unzip -q -o -j "$APK" "lib/$ABI/libnodebridge.so" -d "$TMP" 2>/dev/null || true

            if [ ! -f "$TMP/libnodebridge.so" ]; then
              echo "❌ lib/$ABI/libnodebridge.so TIDAK ada di dalam APK"
              FAIL=1
              rm -rf "$TMP"
              continue
            fi

            if readelf --dyn-syms -W "$TMP/libnodebridge.so" | grep -q "$SIMBOL"; then
              echo "✅ lib/$ABI/libnodebridge.so ada + punya simbol $SIMBOL"
            else
              echo "❌ lib/$ABI/libnodebridge.so nggak punya simbol $SIMBOL"
              echo "   → Node nggak akan jalan di HP (UnsatisfiedLinkError)."
              echo "   Cek: nama paket/kelas di native-lib.cpp, dan keep-rule JNI di proguard-rules.pro."
              FAIL=1
            fi
            rm -rf "$TMP"
          done

          exit $FAIL

      - name: Cek dex hasil R8 (nama yang dipanggil lewat string masih utuh)
        run: |
          APK="dist/${{ steps.vars.outputs.apk-name }}"
          TMP="$(mktemp -d)"
          unzip -q -j "$APK" 'classes*.dex' -d "$TMP"

          # Nama class WAJIB masih ada di dex (deskriptor dalvik-nya).
          WAJIB="
          Lcom/xykals/warelease/App;
          Lcom/xykals/warelease/NodeBridge;
          Lcom/xykals/warelease/BotService;
          Lcom/xykals/warelease/MainActivity;
          Lcom/xykals/warelease/BootReceiver;
          Lcom/xykals/warelease/BotWatchdogWorker;
          "
          FAIL=0
          for NAMA in $WAJIB; do
            if grep -aq "$NAMA" "$TMP"/*.dex; then
              echo "✅ $NAMA"
            else
              echo "❌ $NAMA HILANG dari dex — R8 ke-rename, nanti crash di HP"; FAIL=1
            fi
          done

          # Method JNI-nya juga: native-lib.cpp nyari
          # Java_com_xykals_warelease_NodeBridge_startNode, jadi 'startNode'
          # harus tetap ada namanya.
          if grep -aq "startNode" "$TMP"/*.dex; then
            echo "✅ method startNode (dipanggil JNI)"
          else
            echo "❌ method startNode hilang — JNI bakal gagal (UnsatisfiedLinkError)"; FAIL=1
          fi

          rm -rf "$TMP"
          exit $FAIL

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vars.outputs.apk-name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # mapping.txt: peta nama lama → nama baru hasil R8. Disimpan buat
      # menerjemahkan stack trace dari HP (yang namanya udah di-obfuscate)
      # balik jadi nama class asli. Cuma berguna kalau versinya sama.
      - name: Upload mapping R8 (buat baca crash log)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-${{ steps.vars.outputs.abi-slug }}
          path: app/build/outputs/mapping/*/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Ringkasan
        run: |
          {
            echo "### 📦 APK siap"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Varian | \`${{ steps.vars.outputs.variant }}\` |"
            echo "| File | \`${{ steps.vars.outputs.apk-name }}\` |"
            echo "| Ukuran | $(du -h dist/${{ steps.vars.outputs.apk-name }} | cut -f1) |"
            echo "| Signing | $([ -n "${RELEASE_KEYSTORE_FILE:-}" ] && echo 'keystore release' || echo 'debug key') |"
            echo ""
            echo "SHA-256: \`$(cut -d' ' -f1 dist/${{ steps.vars.outputs.apk-name }}.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  #  3) GitHub Release — cuma jalan kalau push tag v*
  # ==========================================================================
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # SENGAJA tanpa concurrency: release nggak boleh dibatalkan di tengah jalan.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Ambil SEMUA APK hasil matrix. Artifact name-nya berawalan
      # 'wa-release-bot-' dan isinya unik per ABI, jadi aman digabung.
      # merge-multiple: true menaruh semua file di satu folder 'dist/'.
      - name: Ambil semua APK hasil matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wa-release-bot-*.apk
          merge-multiple: true
          path: dist

      - name: Pastikan ketiga APK lengkap
        run: |
          ls -la dist/
          FAIL=0
          for W in arm64 armeabi-v7a universal; do
            if ls dist/wa-release-bot-$W-release.apk >/dev/null 2>&1; then
              echo "✅ wa-release-bot-$W-release.apk ($(du -h dist/wa-release-bot-$W-release.apk | cut -f1))"
            else
              echo "❌ wa-release-bot-$W-release.apk TIDAK ada"; FAIL=1
            fi
          done
          exit $FAIL

      - name: Buat Release + attach APK
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            dist/*.apk
            dist/*.sha256
          body: |
            ## 🦴 WA Release Bot ${{ github.ref_name }}

            Tersedia **tiga APK**. Pilih satu — ketiganya aplikasi yang sama,
            bedanya cuma arsitektur prosesor yang disertakan.

            | File | Buat HP | Ukuran |
            |---|---|---|
            | `wa-release-bot-arm64-release.apk` | 64-bit — hampir semua HP sekarang | ±21 MB |
            | `wa-release-bot-armeabi-v7a-release.apk` | 32-bit — HP lama | ±20 MB |
            | `wa-release-bot-universal-release.apk` | nggak yakin? pakai ini | ±37 MB |

            **Nggak tahu HP-nya 32 atau 64 bit?** Pakai yang `universal` — jalan
            di dua-duanya. Yang 64/32-bit itu lebih kecil, jadi unduhannya lebih
            cepat.

            | Item | Nilai |
            |---|---|
            | minSdk / targetSdk | 26 / 34 |
            | Engine | Node.js 18.20.4 (nodejs-mobile) |
            | WhatsApp client | Baileys 6.7.24 |
            | Optimasi | R8 (minify + resource shrinking) |

            **Install:** aktifkan "Install unknown apps" di HP, pasang APK-nya,
            lalu ikuti bagian
            [Pakai Setelah Install](https://github.com/${{ github.repository }}#-pakai-setelah-install).

            **Verifikasi unduhan** (opsional tapi disarankan):
            ```bash
            sha256sum -c <nama-file>.apk.sha256
            ```

            **Kalau ada yang aneh-aneh:** di dalam app ada tombol **Kirim Log**.
            Semua kejadian dicatat ke `Android/media/<nama-paket>/log/` — folder
            itu bisa dibuka dari HP maupun lewat kabel, tanpa root. Yang paling
            penting `crash.log` (isi penyebab kalau app-nya pernah mati sendiri).
            Kirim file-nya kalau mau lapor masalah.

            Ketiganya ditandatangani dengan kunci yang sama, jadi update berikutnya
            bisa dipasang langsung tanpa uninstall.

            > ⚠️ Ini automation WhatsApp pihak ketiga. Risiko akun dibatasi Meta
            > ada dan sepenuhnya tanggung jawab pemakai. Jangan pakai buat spam.
