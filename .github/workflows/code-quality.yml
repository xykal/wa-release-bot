name: Code quality

# Analisis statis + unit test, tanpa build APK. Target < 5 menit supaya jadi
# gerbang review tiap PR.
#
# Dependensi JS dikelola npm workspaces di root (bot-js + cli), jadi engine dan
# CLI memakai modul yang sama persis dan cuma ada SATU package-lock.json.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ lockfile
  # Lockfile root dibuat di CI, bukan di mesin lokal, lalu di-commit atas nama
  # xykal. Push pakai GITHUB_TOKEN tidak memicu workflow lain (anti-loop).
  # Run berikutnya memakai `npm ci` yang deterministik.
  lockfile:
    name: Lockfile root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Buat package-lock.json kalau belum ada
        id: buat
        run: |
          if [ -f package-lock.json ]; then
            echo "lockfile sudah ada"
            echo "baru=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "baru=true" >> "$GITHUB_OUTPUT"
      - name: Commit lockfile (hanya push ke main)
        if: steps.buat.outputs.baru == 'true' && github.event_name == 'push'
        run: |
          git config --local user.name "xykal"
          git config --local user.email "xykal@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): bootstrap package-lock.json root (npm workspaces)" || echo "nothing to commit"
          git push

  # ---------------------------------------------------------------- JavaScript
  js:
    name: Lint & test JS (Node ${{ matrix.node }})
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 18.20.4 = Node di dalam APK (nodejs-mobile). 20/22 = CLI di Termux/PC.
        node: ['18.20.4', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install (workspaces)
        # --ignore-scripts: preinstall Baileys menolak Node < 20, padahal
        # runtime APK memang 18.20.4 dan sudah dibuktikan jalan lewat selftest.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "package-lock.json belum ada di commit ini (run pertama) - pakai npm install"
            npm install --ignore-scripts --no-audit --no-fund
          fi

      # eslint >= 9.3x memanggil util.styleText (Node >= 20); lint di 18 meledak
      # bukan karena kode salah. Yang wajib jalan di 18.20.4 tetap diuji di
      # bawah: unit test, bundle, selftest.
      - name: Lint
        if: matrix.node == '22'
        run: npm run lint -w bot-js

      - name: Syntax check semua source
        run: find bot-js/src cli/src -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Unit test
        run: npm test -w bot-js

      - name: Build bundle
        run: npm run build -w bot-js

      - name: Bundle jalan di Node ${{ matrix.node }}
        run: node bot-js/dist/bundle.cjs --selftest

      - name: CLI bisa dimuat (--version)
        run: node cli/src/bot.mjs --version

      # Proses CLI sungguhan dengan GitHub palsu (--import), tanpa WA/jaringan:
      # --dry-run, --once (baseline, tidur, 304), config hilang.
      - name: Tes integrasi CLI
        run: node --test cli/test/

  # ---------------------------------------------------------------- Android statis
  android-statis:
    name: Cek statis Android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libnodebridge.so punya DT_NEEDED ke libnode.so; kalau System.loadLibrary
      # tidak dipanggil dengan urutan itu, mesin Node tidak pernah nyala dan
      # gagalnya baru kelihatan di HP, bukan di build.
      - name: Jembatan JNI harus dimuat eksplisit, urutan node lalu nodebridge
        run: |
          BRIDGE="app/src/main/java/com/xykals/warelease/NodeBridge.kt"
          FAIL=0
          for LIB in node nodebridge; do
            if ! grep -q "System.loadLibrary(\"$LIB\")" "$BRIDGE"; then
              echo "System.loadLibrary(\"$LIB\") hilang dari $BRIDGE"; FAIL=1
            fi
          done
          URUT="$(grep -o 'System.loadLibrary("[a-z]*")' "$BRIDGE" | sed 's/.*loadLibrary("//;s/")//' | tr '\n' ' ')"
          if [ "$URUT" != "node nodebridge " ]; then
            echo "urutan loadLibrary salah: '$URUT' (harusnya 'node nodebridge ')"; FAIL=1
          fi
          exit $FAIL

      - name: Brand string tunggal dipakai, bukan literal
        run: |
          set -e
          test -f app/src/main/res/values/brand.xml
          test -f bot-js/src/config/brand.mjs
          if grep -rnE 'android:text="(BUILT IN|Powered by|XyVerse Tech)' app/src/main/res/layout; then
            echo "brand literal di layout - pakai @string/brand_*"; exit 1
          fi

      # URL Worker lagu cuma boleh ada di bot-js/src/lagu.mjs. Versi 1.6.0-1.6.7
      # menulisnya juga di SettingsStore.kt dengan subdomain yang salah.
      - name: URL Worker tidak ditulis ulang di sisi Android
        run: |
          if grep -rn 'workers\.dev' app/src/main/java app/src/main/res; then
            echo "URL workers.dev di app/ - biarkan engine (bot-js/src/lagu.mjs) yang menentukan"; exit 1
          fi
          test "$(grep -c 'workers\.dev' bot-js/src/lagu.mjs)" -ge 1

      # Bug v1.6.0-1.6.7: URL default menunjuk subdomain yang tidak pernah ada
      # (NXDOMAIN), fitur lagu mati diam-diam. Sekarang hostname-nya wajib resolve.
      - name: Hostname Worker lagu resolve
        run: |
          HOST="$(grep -oE "SUMBER_BAWAAN = 'https://[^/']+" bot-js/src/lagu.mjs | sed "s#.*'https://##")"
          echo "SUMBER_BAWAAN host: $HOST"
          getent hosts "$HOST" || { echo "hostname $HOST tidak resolve"; exit 1; }

      - name: Semua XML resource + manifest valid
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom as m
          files = glob.glob('app/src/main/res/**/*.xml', recursive=True) + ['app/src/main/AndroidManifest.xml']
          rusak = 0
          for f in files:
              try:
                  m.parse(f)
              except Exception as e:  # noqa: BLE001 - laporkan semua, jangan berhenti di yang pertama
                  print(f'{f}: {e}'); rusak += 1
          print(f'{len(files)} file XML dicek, {rusak} rusak')
          sys.exit(1 if rusak else 0)
          PY

  # ---------------------------------------------------------------- audit
  audit:
    name: Audit dependensi
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: npm audit (root workspaces)
        # Yang memblokir cuma high/critical di dependency produksi; dev-only
        # (esbuild, eslint) dilaporkan tapi tidak ikut APK.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm audit --omit=dev --audit-level=high
          echo "--- laporan lengkap (informasional) ---"
          npm audit || true

      - name: Tidak boleh ada token/secret yang ke-commit
        run: |
          set -e
          if git grep -nEI \
              -e 'ghp_[A-Za-z0-9]{36}' \
              -e 'gho_[A-Za-z0-9]{36}' \
              -e 'github_pat_[A-Za-z0-9_]{20,}' \
              -e 're_[A-Za-z0-9_-]{20,}' \
              -e 'tskey-auth-[A-Za-z0-9-]{20,}' \
              -e 'os_v2_app_[A-Za-z0-9]{20,}' \
              -e 'gsk_[A-Za-z0-9]{40,}' \
              -e 'vcp_[A-Za-z0-9]{20,}' \
              -e 'sk-[A-Za-z0-9]{32,}' \
              -e 'cfut_[A-Za-z0-9]{30,}' \
              -e 'GOCSPX-[A-Za-z0-9_-]{20,}' \
              -- . ; then
            echo "Ada yang kelihatan seperti token di dalam repo"
            exit 1
          fi
          echo "bersih"

  # ------------------------------------------------------------------ shell/YAML
  scripts:
    name: Lint script & workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find scripts cli -maxdepth 1 -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash

      # Versi + sha256 dipin: skrip "download-actionlint.bash" dari branch main
      # bisa berubah kapan saja dan itu kode yang dieksekusi di runner.
      - name: actionlint (lint file workflow)
        run: |
          set -e
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$URL" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Validasi YAML lainnya
        run: |
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              print("pyyaml tidak ada - dilewati")
              sys.exit(0)
          bad = 0
          for pola in ('*.yml', '*.yaml'):
              for p in pathlib.Path('.').rglob(pola):
                  if 'node_modules' in p.parts:
                      continue
                  try:
                      yaml.safe_load(p.read_text())
                  except Exception as e:
                      print(f"{p}: {e}")
                      bad += 1
          print("semua YAML valid" if not bad else f"{bad} file bermasalah")
          sys.exit(1 if bad else 0)
          PY

      - name: File executable harus punya bit +x
        run: |
          fail=0
          for f in gradlew scripts/*.sh cli/setup-termux.sh; do
            if [ -f "$f" ] && [ ! -x "$f" ]; then
              echo "$f tidak executable"; fail=1
            fi
          done
          exit $fail
