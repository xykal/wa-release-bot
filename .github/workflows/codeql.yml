name: CodeQL

# Analisis keamanan statis (SAST) untuk JavaScript engine + Kotlin/Java Android.
# Hasilnya muncul di tab Security → Code scanning.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # tiap Senin 03:17 UTC — nangkep query baru walau kode nggak berubah
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # ----------------------------------------------------------------- Java
      - name: Setup JDK 17
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK + CMake
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      # CodeQL cuma menganalisis kode Kotlin, tapi Gradle tetap butuh
      # bundle.cjs + libnode.so supaya konfigurasi native-nya valid.
      - name: Siapkan artifact yang dibutuhkan build Android
        if: matrix.build-mode == 'manual'
        run: |
          mkdir -p app/src/main/assets/node
          echo '// placeholder untuk CodeQL build' > app/src/main/assets/node/bundle.cjs
          bash scripts/fetch-nodejs-mobile.sh

      - name: Compile Kotlin/Java (di-trace CodeQL)
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon :app:assembleDebug -x lint -x test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
