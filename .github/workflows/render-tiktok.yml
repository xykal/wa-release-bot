name: Render TikTok

# Render video TikTok 1080x1920 di GitHub Actions (BUKAN di lokal/Cloudflare/Vercel).
#   - Cloudflare Workers: nggak bisa (CPU ms, tanpa ffmpeg)
#   - Vercel: nggak bisa (timeout 10-60s, tanpa ffmpeg persistent)
#   - Actions: BISA (2-core, 7GB, ffmpeg preinstalled, ~4 menit)
#
# Cara pakai: tab Actions → Render TikTok → Run workflow.
# Hasil: artifact `tiktok-mp4` (30 hari) + optional upload Cloudinary.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voiceover (Edge TTS Indonesia)'
        type: choice
        default: id-ID-GadisNeural
        options:
          - id-ID-GadisNeural
          - id-ID-ArdiNeural
      voice_rate:
        description: 'Kecepatan (contoh: +8%)'
        default: '+8%'
      voice_pitch:
        description: 'Nada (contoh: +10Hz = lebih imut)'
        default: '+10Hz'
      dry_run:
        description: 'Dry-run tanpa TTS (validasi visual doang)'
        type: boolean
        default: false
      upload_cloudinary:
        description: 'Upload hasil ke Cloudinary (butuh secret CLOUDINARY_URL)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-tiktok-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render 1080x1920
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tiktok/requirements.txt

      - name: Cek ffmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-list | grep -i dejavu | head -n 3 || sudo apt-get install -y fonts-dejavu-core

      - name: Install deps (edge-tts + Pillow doang, <60 detik)
        run: pip install -r tiktok/requirements.txt

      - name: Cache assets (stiker + SFX)
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: tiktok/assets
          key: tiktok-assets-v1-${{ hashFiles('tiktok/stickers.txt', 'tiktok/meme_sfx.txt') }}

      - name: Fetch assets
        run: python tiktok/fetch_assets.py

      - name: Override voice (kalau diisi di input)
        env:
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.voice_rate }}
          PITCH: ${{ inputs.voice_pitch }}
        run: |
          python - <<'EOF'
          import json, os
          p = 'tiktok/script.json'
          s = json.load(open(p, encoding='utf-8'))
          s['meta']['voice'] = os.environ['VOICE']
          s['meta']['voice_rate'] = os.environ['RATE']
          s['meta']['voice_pitch'] = os.environ['PITCH']
          json.dump(s, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('voice:', s['meta']['voice'], s['meta']['voice_rate'], s['meta']['voice_pitch'])
          EOF

      - name: Render video
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          mkdir -p dist
          if [ "$DRY" = "true" ]; then
            python tiktok/render.py --dry-run --out dist/tiktok_vertical.mp4
          else
            python tiktok/render.py --out dist/tiktok_vertical.mp4
          fi
          ls -la dist/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 dist/tiktok_vertical.mp4

      - name: Thumbnail preview (3 frame)
        if: always()
        run: |
          mkdir -p dist/preview
          for T in 1 15 30; do
            ffmpeg -y -loglevel error -ss $T -i dist/tiktok_vertical.mp4 -frames:v 1 dist/preview/t$T.jpg || true
          done
          ls -la dist/preview/ || true

      - name: Upload MP4 (artifact 30 hari)
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-mp4
          path: |
            dist/tiktok_vertical.mp4
            dist/preview/*.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Upload ke Cloudinary (opsional)
        if: inputs.upload_cloudinary
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          if [ -z "$CLOUDINARY_URL" ]; then
            echo "Secret CLOUDINARY_URL belum diset — skip."
            exit 0
          fi
          pip install cloudinary >/dev/null 2>&1
          python - <<'EOF'
          import cloudinary, cloudinary.uploader, os
          cloudinary.config(cloudinary_url=os.environ['CLOUDINARY_URL'])
          r = cloudinary.uploader.upload('dist/tiktok_vertical.mp4', resource_type='video', folder='wa-release-bot/tiktok')
          print('SECURE_URL:', r['secure_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"\n### Cloudinary\n\n{r['secure_url']}\n")
          EOF

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### TikTok render selesai"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Voice | \`${{ inputs.voice }}\` ${{ inputs.voice_rate }} ${{ inputs.voice_pitch }} |"
            echo "| File | \`tiktok_vertical.mp4\` ($(du -h dist/tiktok_vertical.mp4 2>/dev/null | cut -f1)) |"
            echo "| Durasi | $(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/tiktok_vertical.mp4 2>/dev/null | cut -d. -f1)s |"
            echo ""
            echo "Download di **Artifacts → tiktok-mp4**. Upload manual ke TikTok."
          } >> "$GITHUB_STEP_SUMMARY"
