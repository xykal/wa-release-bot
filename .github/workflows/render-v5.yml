name: Render TikTok v5

# Render konten TikTok v5 (1080x1920, 60fps) di GitHub Actions — BUKAN lokal.
# v5 = v4 + scene "si Kall ngapain wok" + kartu varian APK + chip interval/token
#   + balasan Kall di CTA + SFX/meme/stiker ekstra. Patch di render5.py (render4.py utuh).
# Kenapa di sini: 9231 frame PIL + libx264, berat buat laptop/HP.
#   - Cloudflare Workers: nggak bisa (tanpa ffmpeg, CPU milidetik)
#   - Vercel: nggak bisa (timeout 60 dtk, tanpa ffmpeg persistent)
#   - Actions: BISA (4-core, ffmpeg via imageio, timeout jam-jaman)
#
# Cara pakai: tab Actions → Render TikTok v5 → Run workflow.
# Hasil: artifact `tiktok-v5-mp4` (2 MP4: musik + tanpa-musik, 30 hari).
# Output 720x1280 30fps (ringan buat upload) — di-downscale otomatis dari render 1080p60.
# Timing kata (wav2t/*.json) sudah jadi — TIDAK perlu Whisper/Torch.

on:
  workflow_dispatch:
    inputs:
      cek_saja:
        description: 'Cuma frame preview (--cek), tanpa render penuh'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render 60fps
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps (Pillow + numpy + shapely + imageio-ffmpeg)
        run: pip install --no-cache-dir Pillow numpy shapely imageio imageio-ffmpeg

      - name: Siapkan logo XyVerse
        run: |
          mkdir -p konten-tiktok/assets
          cp app/src/main/res/drawable-nodpi/xyverse_logo.webp konten-tiktok/assets/
          ls -la konten-tiktok/assets/

      - name: Verifikasi aset suara + timing
        run: |
          python3 - <<'EOF'
          import os, sys
          urut = ['00a','00b','02','10','03','11','12','04','05','13','06','07','08','14','16','15']
          hilang = [v for v in urut if not (
              os.path.exists(f'konten-tiktok/wav2t/{v}.wav') and
              os.path.exists(f'konten-tiktok/wav2t/{v}.json'))]
          if hilang:
              print('TIMING HILANG:', hilang); sys.exit(1)
          print('aset lengkap: 16 VO + 16 timing + SFX + stiker OK')
          EOF

      - name: Timeline check (--kata)
        working-directory: konten-tiktok
        run: python3 render5.py --kata

      - name: Frame preview (--cek)
        working-directory: konten-tiktok
        run: python3 render5.py --cek 2 31 58 98 134 145

      - name: Render penuh (60fps, 4 proses)
        if: inputs.cek_saja != true
        working-directory: konten-tiktok
        run: python3 render5.py


      - name: Downscale ke 720p30 (ganti file 1080p)
        if: inputs.cek_saja != true
        run: |
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          for f in konten-tiktok/tiktok-v5-*.mp4; do
            "$FF" -v error -y -i "$f" -vf scale=720:1280:flags=lanczos,fps=30 \
              -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
              -c:a copy -movflags +faststart "${f%.mp4}-720p30.mp4" && mv "${f%.mp4}-720p30.mp4" "$f"
          done
          ls -la konten-tiktok/*.mp4
      - name: Verifikasi durasi MP4 (anti-kepotong)
        if: inputs.cek_saja != true
        run: |
          python3 - <<'EOF'
          import subprocess, re, glob, sys
          import imageio_ffmpeg  # ffprobe sistem nggak ada di runner — pakai ffmpeg imageio
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          files = sorted(glob.glob('konten-tiktok/tiktok-v5-*.mp4'))
          assert len(files) == 2, f'harusnya 2 MP4, ketemu {len(files)}'
          for f in files:
              out = subprocess.run([ff, '-i', f], capture_output=True, text=True).stderr
              m = re.search(r'Duration: (\d+):(\d+):([\d.]+)', out)
              dur = int(m.group(1)) * 3600 + int(m.group(2)) * 60 + float(m.group(3))
              assert '720x1280' in out, f'resolusi bukan 720p!'
              assert '30 fps' in out, f'fps bukan 30!'
              print(f'{f} = {dur:.1f}s 720p30 (minimal 145s)', flush=True)
              if dur < 145:
                  print('KEPOTONG! Render ulang.', flush=True); sys.exit(1)
          print('durasi OK')
          EOF

      - name: Upload MP4 + preview
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-v5-mp4
          path: |
            konten-tiktok/tiktok-v5-*.mp4
            konten-tiktok/cek5_*.png
          if-no-files-found: error
          retention-days: 30

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### TikTok v5"
            echo ""
            echo "| File | Ukuran |"
            echo "|---|---|"
            for f in konten-tiktok/tiktok-v5-*.mp4; do
              [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -h $f | cut -f1) |"
            done
            echo ""
            echo "Download di **Artifacts → tiktok-v5-mp4**. Upload manual ke TikTok."
            echo "Panduan: \`konten-tiktok/CARA-UPLOAD.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
