# Tangkapan layar app ASLI dari emulator Android untuk landing page (web/img/hp-*.webp).
# Manual (workflow_dispatch) atau otomatis kalau file ini / skripnya berubah di PR.
# Bukan bagian rilis: APK debug x86_64 hanya untuk emulator, tidak diunggah ke mana pun
# selain artifact screenshot.
name: Screenshot app

on:
  workflow_dispatch:
    inputs:
      bahasa:
        description: 'Bahasa UI di emulator (layar utama app dua bahasa)'
        type: choice
        options: [id-ID, en-US]
        default: id-ID
  pull_request:
    paths: ['.github/workflows/screenshot-app.yml', 'scripts-dev/screenshot_emulator.sh']

permissions:
  contents: read

concurrency:
  group: screenshot-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '18.20.4'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  NODEJS_MOBILE_VERSION: 'v18.20.4'
  ABIS: x86_64
  API_LEVEL: 34

jobs:
  tangkap:
    name: Emulator API 34 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bundle engine (sama dengan build-apk.yml)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w bot-js
          mkdir -p app/src/main/assets/node
          cp bot-js/dist/bundle.cjs app/src/main/assets/node/bundle.cjs

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK + CMake
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: Cache nodejs-mobile x86_64
        id: njsm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/src/main/jniLibs
            app/libnode
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}-x86_64

      - name: Download nodejs-mobile (libnode.so x86_64)
        if: steps.njsm-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-nodejs-mobile.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build APK release x86_64 (tanda tangan debug)
        # Varian release (R8 + shrinkResources, tanpa suffix -debug) supaya tampilannya
        # sama dengan APK yang diunduh orang; tanpa keystore, gradle memakai tanda tangan
        # debug (app/build.gradle) jadi tetap bisa dipasang di emulator. Versi = versi
        # launching publik (docs/ROADMAP.md) agar header app di situs tidak menampilkan
        # versi internal.
        run: >-
          ./gradlew --no-daemon :app:assembleRelease -Pabis=x86_64
          -PversionName=1.0.0 -PversionCode=1010000 --stacktrace

      - name: Aktifkan KVM (emulator dengan akselerasi)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + screenshot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: BAHASA=${{ inputs.bahasa || 'id-ID' }} APK=app/build/outputs/apk/release/app-release.apk PKG=com.xykals.warelease OUT=tangkapan-app bash scripts-dev/screenshot_emulator.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-app
          path: tangkapan-app/*.png
          if-no-files-found: error
          retention-days: 7
