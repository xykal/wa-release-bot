name: Security

# Tiga lapis:
#   1. secret scanning → pastikan nggak ada token/secret yang ke-commit
#   2. dependency-review → blokir PR yang menambah dependency rentan/berlisensi galak
#   3. scorecard → skor hygiene supply-chain repo (OpenSSF)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  # ------------------------------------------------------------------ 1) secret
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # perlu seluruh riwayat buat scan semua commit

      # Pakai binary resmi, bukan gitleaks-action: nggak butuh lisensi, nggak ada
      # env var action yang bisa berubah diam-diam, dan perilakunya sama persis
      # dengan yang diuji di lokal (gitleaks 8.30.1).
      - name: Install gitleaks
        run: |
          {
            echo "Mengunduh gitleaks ${GITLEAKS_VERSION}"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
          }
          gitleaks version

      - name: Scan riwayat git
        run: |
          # --redact supaya kalau ADA kebocoran, nilainya nggak ikut tercetak
          # ke log publik Actions (log build repo publik bisa dibaca siapa saja).
          gitleaks git --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .

      - name: Cek config gitleaks masih memuat ruleset default
        run: |
          # Jaring pengaman: kalau `[extend] useDefault = true` hilang, gitleaks
          # cuma pakai aturan custom kita dan nggak akan nangkep GitHub PAT,
          # AWS key, private key, dll. — silently. Jadi kita uji langsung:
          # tanam token AWS palsu, harus KETANGKAP.
          # Token canary-nya DIACAK setiap run, bukan ditulis di file ini.
          # Dua alasan:
          #   1. Kalau literal, langkah "Scan riwayat git" di atas bakal
          #      nangkep file ini sendiri (sudah pernah kejadian).
          #   2. Kalau nilainya tetap, gampang banget "diakalin" dengan
          #      memasukkannya ke allowlist — dan pernah kejadian juga,
          #      sehingga canary-nya diam-diam berhenti bekerja.
          # Formatnya sengaja mengikuti pola AWS key asli (AKIA + 16 karakter
          # dari alfabet A-Z2-7) supaya benar-benar diuji oleh rule bawaan.
          CANARY="AKIA$(head -c 512 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | head -c 16)"
          TMP="$(mktemp -d)"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$CANARY" > "$TMP/canary.txt"
          if gitleaks dir --config .gitleaks.toml --no-banner "$TMP" > /dev/null 2>&1; then
            echo "❌ Ruleset default gitleaks TIDAK aktif — cek [extend] useDefault di .gitleaks.toml"
            exit 1
          fi
          echo "✅ Ruleset default aktif (canary token tertangkap)"
          rm -rf "$TMP"

  # ------------------------------------------------------------------ 2) deps
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Lisensi yang nggak boleh masuk build (copyleft kuat bikin ribet
          # kalau proyek ini mau dipakai komersial).
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  # ------------------------------------------------------------------ 3) scorecard
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 2

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
