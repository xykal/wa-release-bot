plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI (GitHub Actions) men-set env var ini kalau secrets keystore tersedia.
// Kalau tidak, build release tetap jalan tapi di-sign dengan debug key.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")

// Versi bisa di-override dari CI:  ./gradlew assembleRelease -PversionName=1.2.0 -PversionCode=5
def appVersionName = (project.findProperty('versionName') ?: '1.2.2').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '9').toString().toInteger()

android {
    namespace 'com.xykals.warelease'
    // 35 (Android 15) — dibutuhkan androidx terbaru: appcompat 1.8.0 dan
    // material 1.14.0 menarik androidx.core 1.16.0 yang menolak di-compile
    // kalau compileSdk masih 34. targetSdk sengaja TETAP 34 supaya perilaku
    // runtime tidak berubah diam-diam.
    compileSdk 35

    // Dipatok supaya build lokal dan CI pakai NDK yang sama.
    // Harus sinkron dengan .github/workflows/build-apk.yml dan scripts/fetch-nodejs-mobile.sh
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.xykals.warelease"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            // ABI yang ikut dipackage. Bisa diatur dari luar:
            //   ./gradlew assembleRelease -Pabis=armeabi-v7a
            //   ./gradlew assembleRelease -Pabis=arm64-v8a,armeabi-v7a
            //
            // nodejs-mobile v18.20.4 nyediain 3 prebuilt: arm64-v8a, armeabi-v7a,
            // dan x86_64 (buat emulator). Yang belum diambil dari zip-nya bakal
            // bikin build gagal di CMake — jadi kalau mau nambah ABI, jalankan
            // dulu:  ABIS="arm64-v8a armeabi-v7a" bash scripts/fetch-nodejs-mobile.sh
            //
            // Default cuma arm64-v8a karena hampir semua HP sekarang 64-bit dan
            // tiap ABI nambah ~20 MB ke ukuran APK.
            abiFilters(*(project.findProperty('abis') ?: 'arm64-v8a').toString().split(/[,\s]+/).findAll { it })
        }

        externalNativeBuild {
            cmake {
                // Lokasi header node.h + jniLibs/libnode.so.
                // Diisi eksplisit supaya CMakeLists tidak menebak-nebak path relatif.
                arguments "-DLIBNODE_ROOT=${file('libnode').absolutePath}",
                          "-DJNI_LIBS_DIR=${file('src/main/jniLibs').absolutePath}",
                          "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // R8: perkecil APK dengan membuang kode & resource yang nggak
            // dipakai, plus me-rename nama class jadi pendek.
            //
            // Di app ini risikonya kecil karena nggak ada reflection dan
            // nggak ada WebView/addJavascriptInterface — bridge ke Node lewat
            // file, bukan lewat nama class. Sisanya dijaga di
            // app/proguard-rules.pro (JNI, WorkManager, komponen manifest).
            //
            // Efeknya ke ukuran terbatas: yang paling gedek di APK ini
            // libnode.so (±49 MB mentah), bukan kode Kotlin. R8 memangkas
            // classes.dex ±9,6 MB jadi sekitar sepertiganya.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = releaseKeystoreFile ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // libnode.so belum di-strip → butuh legacy packaging biar bisa di-load
            // di Android lama. Catatan: ini juga bikin APK lebih besar.
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json',
            ]
        }
    }

    // Laporan untuk job analisis di CI. `abortOnError false` → lint bukan
    // gerbang build (APK tetap keluar), tapi hasilnya di-upload sebagai SARIF
    // supaya muncul di tab "Code scanning" GitHub.
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
        htmlReport true
        xmlReport true
        sarifReport true
        checkDependencies true
        disable += ['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion']
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Dipakai MainActivity lewat AppCompatActivity. Tanpa baris ini app TIDAK
    // bisa di-compile (unresolved reference: androidx.appcompat).
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
}
