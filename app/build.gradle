plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI (GitHub Actions) men-set env var ini kalau secrets keystore tersedia.
// Kalau tidak, build release tetap jalan tapi di-sign dengan debug key.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")

android {
    namespace 'com.xykals.warelease'
    compileSdk 34

    defaultConfig {
        applicationId "com.xykals.warelease"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            // arm64-v8a = 99%+ HP Android saat ini (APK lebih kecil ~2x)
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = releaseKeystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.2'
}
