plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI (GitHub Actions) men-set env var ini kalau secrets keystore tersedia.
// Kalau tidak, build release tetap jalan tapi di-sign dengan debug key.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")

// Versi bisa di-override dari CI:  ./gradlew assembleRelease -PversionName=1.2.0 -PversionCode=5
def appVersionName = (project.findProperty('versionName') ?: '1.1.0').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '2').toString().toInteger()

android {
    namespace 'com.xykals.warelease'
    compileSdk 34

    // Dipatok supaya build lokal dan CI pakai NDK yang sama.
    // Harus sinkron dengan .github/workflows/build-apk.yml dan scripts/fetch-nodejs-mobile.sh
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.xykals.warelease"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            // arm64-v8a = 99%+ HP Android saat ini (APK lebih kecil ~2x).
            // nodejs-mobile cuma menyediakan prebuilt arm64-v8a + x86_64.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // Lokasi header node.h + jniLibs/libnode.so.
                // Diisi eksplisit supaya CMakeLists tidak menebak-nebak path relatif.
                arguments "-DLIBNODE_ROOT=${file('libnode').absolutePath}",
                          "-DJNI_LIBS_DIR=${file('src/main/jniLibs').absolutePath}",
                          "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = releaseKeystoreFile ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // libnode.so belum di-strip → butuh legacy packaging biar bisa di-load
            // di Android lama. Catatan: ini juga bikin APK lebih besar.
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json',
            ]
        }
    }

    // Laporan untuk job analisis di CI. `abortOnError false` → lint bukan
    // gerbang build (APK tetap keluar), tapi hasilnya di-upload sebagai SARIF
    // supaya muncul di tab "Code scanning" GitHub.
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
        htmlReport true
        xmlReport true
        sarifReport true
        checkDependencies true
        disable += ['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion']
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Dipakai MainActivity lewat AppCompatActivity. Tanpa baris ini app TIDAK
    // bisa di-compile (unresolved reference: androidx.appcompat).
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
}
